<div id=fixed-lane-settings class=hide>
  <h3 data-trans>Set group for lane</h3>
  <div class=row>
    <label>
      <span data-trans>top</span>
    </label>
    <select id=group-top class=fixed-lane-group></select>
  </div>
  <div class=row>
    <label>
      <span data-trans>jg</span>
    </label>
    <select id=group-jg class=fixed-lane-group></select>
  </div>
  <div class=row>
    <label>
      <span data-trans>mid</span>
    </label>
    <select id=group-mid class=fixed-lane-group></select>
  </div>
  <div class=row>
    <label>
      <span data-trans>adc</span>
    </label>
    <select id=group-adc class=fixed-lane-group></select>
  </div>
  <div class=row>
    <label>
      <span data-trans>sup</span>
    </label>
    <select id=group-sup class=fixed-lane-group></select>
  </div>
</div>
<div id=team-settings></div>
<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id=sltMap></select>
      </div>
      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class=btn-group>
          <button class="active btn-first-winner btn-winner" data-trans>First</button>
          <button class="btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
        </div>
      </div>
      <div class="row row-theme">
        <div class=theme>
          <i class="icon sun"></i>
          <input type=checkbox id=chkDarkMode checked>
          <i class="icon moon"></i>
        </div>
      </div>
    </div>
    <div class=row>
      <label>
        <i class="icon lane"></i>
        <span data-trans>Lane Type</span>
      </label>
      <div class=btn-group>
        <button id=btn-lane-fromTop class="active btn-lane" data-trans>From Top</button>
        <button id=btn-lane-fixed class=btn-lane data-trans disabled>Fixed Lane</button>
        <button id=btn-lane-random class=btn-lane data-trans>Random</button>
      </div>
    </div>
    <div class=row>
      <label for=speed10x>
        <i class="icon speed10x"></i>
        <span data-trans>10x speed</span>
      </label>
      <input type=checkbox id=speed10x>
      <input type=number id=in_speed value=10 min=2 max=100 disabled=true>
    </div>
  </div>
  <div class=left>
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>수박*2,키위*2,귤*2</textarea>
    <div class=actions>
      <button id=btnNotice>
        <i class="icon megaphone"></i>
      </button>
      <a href=https://marblerouletteshop.com target=_blank id=btnShop class="btn new" title="MarbleRoulette Shop">
        <img src=/5v5roulette/marblerouletteshop.a506d1c2.png>
      </a>
      <div class=sep></div>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div id=notice>
  <h1>Notice</h1>
  <div class=notice-body>
    <h2>커스텀 룰렛 기능 오픈!</h2>
    <p>나만의 특별한 룰렛을 만들 수 있는 커스텀 룰렛 기능이 오픈했어요!</p>
    <p>
      <a href=https://marblerouletteshop.com/intro/roulette target=_blank class="holographic shop-button"><img src=/5v5roulette/marblerouletteshop.a506d1c2.png width=125 height=125> 룰렛 꾸미러 가기</a>
    </p>
  </div>
  <div class=notice-action>
    <button id=closeNotice data-trans>Close</button>
  </div>
</div>
